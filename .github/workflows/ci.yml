name: CI

on:
  push:
    branches:
      - main
      - master
      - ci
  pull_request:
    branches:
      - main
      - master
      - ci
  workflow_dispatch:

permissions:
  contents: write

env:
  actor: "41898282+github-actions[bot]"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code for push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Checkout code for pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest black flake8
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Configure git
        run: |
          git config --local user.email "${actor}@users.noreply.github.com"
          git config --local user.name "${actor}"

      - name: Test
        run: |
          pytest .

      - name: Format
        run: |
          black .

      - name: Lint
        run: |
          flake8 --extend-ignore E203 --max-line-length 88 .

      - name: Commit changes
        run: |
          git add .
          git commit -m "🎨 Style code" || echo "No changes to commit"

      - name: Push changes for push event
        if: github.event_name == 'push'
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}

      - name: Push changes for pull request event
        if: github.event_name == 'pull_request'
        run: |
          git pull --rebase origin "${GITHUB_HEAD_REF}" || true
          git push origin HEAD:refs/heads/${GITHUB_HEAD_REF}